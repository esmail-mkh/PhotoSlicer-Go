name: Build & Release PhotoSlicer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag Version (e.g. v5.2)'
        type: string
        required: false
        default: 'v5.2'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Standalone Executable
        run: wails build -clean

      - name: Package Release
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($ver) -or $ver.StartsWith("refs/")) {
            $ver = "${{ github.event.inputs.version_tag }}"
          }
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "v5.2" }

          $zipName = "PhotoSlicer-$ver-Windows.zip"
          $stage = "release_stage"
          New-Item -ItemType Directory -Force $stage
          Copy-Item "build/bin/PhotoSlicer.exe" "$stage/PhotoSlicer.exe"
          Copy-Item "build/bin/PhotoSlicer.exe" "$stage/PhotoSlicer $ver.exe"
          Copy-Item -Recurse -Force "up-model" "$stage/up-model"
          Compress-Archive -Path "$stage/*" -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
