name: Build & Release PhotoSlicer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create Release on GitHub'
        type: boolean
        required: true
        default: true
      draft:
        description: 'Create Release as Draft'
        type: boolean
        required: false
        default: true
      version_tag:
        description: 'Release Tag Version (leave blank to auto-detect from wails.json)'
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset_suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_os: windows
            asset_suffix: Windows
          - os: ubuntu-latest
            target_os: linux
            asset_suffix: Linux
          - os: macos-latest
            target_os: macos
            asset_suffix: macOS

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Install System Dependencies (Linux)
        if: matrix.target_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev pkg-config build-essential || sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config build-essential

      - name: Make AI Binaries Executable (Linux & macOS)
        if: matrix.target_os != 'windows'
        run: chmod +x up-model/realesrgan-ncnn-vulkan* || true

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        env:
          CGO_ENABLED: '1'
        shell: bash
        run: |
          if [ "${{ matrix.target_os }}" = "windows" ]; then
            go test -v -race -ldflags="-linkmode=external" ./...
          else
            go test -v -race ./...
          fi

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Determine Application Version
        shell: bash
        run: |
          REF_TYPE="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"
          INPUT_TAG="${{ inputs.version_tag }}"

          if [ "$REF_TYPE" = "tag" ] && [ -n "$REF_NAME" ]; then
            TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            VER=$(jq -r '.info.productVersion // empty' wails.json 2>/dev/null || true)
            if [ -z "$VER" ]; then
              VER=$(grep 'Version[[:space:]]*=' engine/constants/constants.go | sed -E 's/.*"([^"]+)".*/\1/')
            fi
            TAG="v$VER"
          fi
          if [[ "$TAG" != v* ]] && [[ "$TAG" != V* ]]; then
            TAG="v$TAG"
          fi
          CLEAN_VER="${TAG#v}"
          CLEAN_VER="${CLEAN_VER#V}"
          echo "APP_TAG=$TAG" >> $GITHUB_ENV
          echo "APP_VERSION=$CLEAN_VER" >> $GITHUB_ENV

      - name: Build Application (Windows)
        if: matrix.target_os == 'windows'
        env:
          CGO_ENABLED: '1'
          CGO_CFLAGS: '-O3'
          CGO_CXXFLAGS: '-O3'
        shell: bash
        run: wails build -clean -o "PhotoSlicer $APP_TAG.exe"

      - name: Build Application (Linux)
        if: matrix.target_os == 'linux'
        run: |
          if pkg-config --exists webkit2gtk-4.0; then
            wails build -clean -o "PhotoSlicer-$APP_TAG"
          else
            wails build -clean -tags webkit2_41 -o "PhotoSlicer-$APP_TAG"
          fi

      - name: Build Application (macOS)
        if: matrix.target_os == 'macos'
        run: wails build -clean

      - name: Package Windows Artifact
        if: matrix.target_os == 'windows'
        shell: powershell
        run: |
          $tag = $env:APP_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $refType = "${{ github.ref_type }}"
            $refName = "${{ github.ref_name }}"
            $inputTag = "${{ inputs.version_tag }}"
            if ($refType -eq "tag" -and -not [string]::IsNullOrWhiteSpace($refName)) {
              $tag = $refName
            } elseif (-not [string]::IsNullOrWhiteSpace($inputTag)) {
              $tag = $inputTag
            } else {
              $wailsJson = Get-Content "wails.json" -Raw | ConvertFrom-Json
              $tag = "v" + $wailsJson.info.productVersion
            }
            if (-not $tag.StartsWith("v") -and -not $tag.StartsWith("V")) {
              $tag = "v" + $tag
            }
          }

          $zipName = "PhotoSlicer-$tag-Windows.zip"
          New-Item -ItemType Directory -Path "dist_pkg" -Force
          Copy-Item "build/bin/*.exe" "dist_pkg\"
          Copy-Item "up-model" "dist_pkg\up-model" -Recurse -Force
          Remove-Item -Path "dist_pkg\up-model\realesrgan-ncnn-vulkan-ubuntu" -ErrorAction SilentlyContinue
          Remove-Item -Path "dist_pkg\up-model\realesrgan-ncnn-vulkan-macos" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist_pkg\*" -DestinationPath $zipName -Force

      - name: Package Linux Artifact
        if: matrix.target_os == 'linux'
        run: |
          TAG="$APP_TAG"
          if [ -z "$TAG" ]; then
            TAG="v$(jq -r '.info.productVersion' wails.json)"
          fi
          if [[ "$TAG" != v* ]] && [[ "$TAG" != V* ]]; then
            TAG="v$TAG"
          fi

          ZIP_NAME="PhotoSlicer-$TAG-Linux.zip"
          mkdir -p dist_pkg
          cp -r build/bin/* dist_pkg/
          cp -r up-model dist_pkg/
          rm -f dist_pkg/up-model/realesrgan-ncnn-vulkan.exe
          rm -f dist_pkg/up-model/vcomp140*.dll
          rm -f dist_pkg/up-model/realesrgan-ncnn-vulkan-macos
          chmod +x dist_pkg/PhotoSlicer* || true
          chmod +x dist_pkg/up-model/realesrgan-ncnn-vulkan-ubuntu || true
          cd dist_pkg && zip -r "../$ZIP_NAME" . && cd ..

      - name: Package macOS Artifact
        if: matrix.target_os == 'macos'
        run: |
          TAG="$APP_TAG"
          if [ -z "$TAG" ]; then
            TAG="v$(jq -r '.info.productVersion' wails.json)"
          fi
          if [[ "$TAG" != v* ]] && [[ "$TAG" != V* ]]; then
            TAG="v$TAG"
          fi

          ZIP_NAME="PhotoSlicer-$TAG-macOS.zip"
          mkdir -p dist_pkg
          APP_PATH=$(find build/bin -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH="build/bin/PhotoSlicer.app"
          fi
          APP_NAME=$(basename "$APP_PATH")
          cp -r "$APP_PATH" dist_pkg/
          cp -r up-model dist_pkg/
          rm -f dist_pkg/up-model/realesrgan-ncnn-vulkan.exe
          rm -f dist_pkg/up-model/vcomp140*.dll
          rm -f dist_pkg/up-model/realesrgan-ncnn-vulkan-ubuntu
          chmod -R +x "dist_pkg/$APP_NAME" || true
          chmod +x dist_pkg/up-model/realesrgan-ncnn-vulkan-macos || true

          # Embed up-model inside PhotoSlicer app Resources for standalone execution in /Applications
          mkdir -p "dist_pkg/$APP_NAME/Contents/Resources"
          cp -r dist_pkg/up-model "dist_pkg/$APP_NAME/Contents/Resources/"

          # Re-sign the entire app bundle after injecting up-model to ensure code signature integrity
          codesign --force --deep -s - "dist_pkg/$APP_NAME"

          ditto -c -k --keepParent dist_pkg "$ZIP_NAME"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSlicer-${{ matrix.asset_suffix }}
          path: PhotoSlicer-*.zip

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Prepare Release Variables
        run: |
          REF_TYPE="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"
          INPUT_TAG="${{ inputs.version_tag }}"

          if [ "$REF_TYPE" = "tag" ] && [ -n "$REF_NAME" ]; then
            TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v$(jq -r '.info.productVersion' wails.json)"
          fi
          if [[ "$TAG" != v* ]] && [[ "$TAG" != V* ]]; then
            TAG="v$TAG"
          fi

          CLEAN_VER="${TAG#v}"
          CLEAN_VER="${CLEAN_VER#V}"
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "CLEAN_VERSION=$CLEAN_VER" >> $GITHUB_ENV
          echo "RELEASE_TITLE=Version $CLEAN_VER" >> $GITHUB_ENV

          IS_DRAFT="true"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.draft }}" = "false" ]; then
            IS_DRAFT="false"
          fi
          echo "IS_DRAFT=$IS_DRAFT" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ env.IS_DRAFT == 'true' }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          files: release_assets/**/*.zip
          body: |
            [🇮🇷 **فارسی**](#-فوتو-اسلایسر-نسخه-${{ env.CLEAN_VERSION }}) | [🇬🇧 **English**](#-photoslicer-v${{ env.CLEAN_VERSION }})

            ---

            <div dir="rtl">

            # 🚀 فوتو اسلایسر نسخه ${{ env.CLEAN_VERSION }}

            **نسخه ${{ env.CLEAN_VERSION }} با پشتیبانی از ورودی PDF، سیستم بررسی خودکار آپدیت، شتاب‌بخشی چشمگیر به پردازش و چسباندن تصاویر، پشتیبانی از فرمت JFIF و بهینه‌سازی‌های جامع منتشر شد!**
            پکیج‌های بومی و مستقل سیستم‌عامل‌های **Windows**, **Linux** و **macOS** با سرعت و پایداری بالا آماده دانلود هستند.

            ### 🌟 ویژگی‌ها و بهبودهای جدید (نسخه ${{ env.CLEAN_VERSION }})
            * **📄 پشتیبانی کامل از ورودی PDF (Single & Batch):** انتخاب و پردازش مستقیم فایل‌های PDF برای استخراج تصاویر یا رندر باکیفیت صفحات در هر دو حالت تکی و دسته‌ای.
            * **⚡ شتاب‌بخشی چشمگیر به چسباندن تصاویر:** بازنویسی و موازی‌سازی کپی بافرها جهت مونتاژ بلادرنگ و فوق‌سریع بوم تصاویر بلند وب‌تون و مانهوا با حداقل مصرف رم.
            * **🔄 بررسی خودکار آپدیت:** بررسی نسخه جدید در پس‌زمینه از گیت‌هاب با بج درخشان در هدر، پالت ۳-نقطه‌ای جمع‌وجور تم‌ها و وضعیت نسخه در About Us.
            * **🖼️ پشتیبانی از فرمت تصویر JFIF:** اضافه شدن کامل پسوند `.jfif` به موتور ورودی، اسکن پوشه، آرشیوها و مسیر سریع تولید PDF.
            * **🎮 تشخیص خودکار کارت گرافیک و VRAM:** اسکن مستقیم DXGI سخت‌افزار و انتخاب هوشمند خودکار بین Real-ESRGAN و Fast Clean با دکمه Auto Detect.
            * **🛡️ بازیابی خودکار و محافظت از پریست‌ها:** خودترمیمی و بازگردانی خودکار تنظیمات از فایل پشتیبان و جلوگیری از رونویسی با پریست‌های خالی.
            * **✂️ الگوریتم برش متعادل و حذف برش‌های ریز:** تلورانس تا ۱۵٪ برای حاشیه‌های امن پنل‌ها، تقسیم مساوی فاصله‌های بزرگ و افزایش حداقل ارتفاع برش به ۵۰۰ پیکسل.
            * **💾 امنیت دیسک و هماهنگی با اکسپلورر:** نام‌گذاری زمان‌دار خروجی‌ها با تاریخ و ساعت، تخلیه بافر به دیسک (`Sync`)، رفرش خودکار فایل اکسپلورر با `SHChangeNotify` و حل مشکل مسیرهای فاصله‌دار.
            * **⏱️ پایداری رابط کاربری:** فریز دقیق تایمر پردازش در وضعیت Pause، همگام‌سازی انیمیشن پالس کلید شروع و ممیزی کامل امنیتی.

            ---

            ### 📥 دانلود و نصب

            فایل **ZIP** مربوط به سیستم‌عامل خود را از پیوست‌های این Release دانلود و اجرا کنید:
            * **[Windows]** `PhotoSlicer-${{ env.RELEASE_TAG }}-Windows.zip`
            * **[Linux]** `PhotoSlicer-${{ env.RELEASE_TAG }}-Linux.zip`
            * **[macOS]** `PhotoSlicer-${{ env.RELEASE_TAG }}-macOS.zip`

            </div>

            ---

            # 🚀 PhotoSlicer v${{ env.CLEAN_VERSION }}

            **Version ${{ env.CLEAN_VERSION }} brings native PDF input support, an automatic update checker, blazing fast image stitching, JFIF support, and comprehensive system stability!**
            Blazing fast native standalone builds for **Windows**, **Linux**, and **macOS** are ready.

            ### 🌟 What's New (v${{ env.CLEAN_VERSION }})
            * **📄 Native PDF Input Support (Single & Batch):** Directly process and extract images from PDF documents in both Single and Batch modes with dedicated picker dialogs.
            * **⚡ Blazing Fast Image Stitching:** Optimized parallel buffer assembly for instant stitching of ultra-tall manhwa canvas strips with minimal RAM footprint.
            * **🔄 Automatic In-App Release Checker:** Background GitHub release checks with a pulsating header badge, compact 3-dot theme dropdown, and About Us status pill.
            * **🖼️ JFIF Format Support:** Integrated `.jfif` support across directory scanning, batch processing, AI enhancement staging, and PDF generation.
            * **🎮 GPU & VRAM Auto-Detection:** DXGI hardware inspection to automatically select between Real-ESRGAN and Fast Clean CPU, with an on-demand Auto Detect button.
            * **🛡️ Self-Healing Settings & Preset Protection:** Automatic recovery from backup configs with strict guardrails preventing accidental overwrites.
            * **✂️ Balanced Slicing & Micro-Slice Elimination:** 15% gutter tolerance for safe margins, even gap division, 500px minimum slice threshold, and trailing slice coalescing.
            * **💾 Output Safety & Shell Integration:** Datetime-stamped folders, disk sync before closing archives, Windows `SHChangeNotify` shell refresh, and spaces-in-path fix.
            * **⏱️ UI Polish & Accurate Timing:** Elapsed timer freezes cleanly on pause, scoped button pulse animations, and enhanced security against XSS.

            ---

            ### 📥 Downloads

            Download the appropriate **ZIP** archive for your operating system below:
            * **[Windows]** `PhotoSlicer-${{ env.RELEASE_TAG }}-Windows.zip`
            * **[Linux]** `PhotoSlicer-${{ env.RELEASE_TAG }}-Linux.zip`
            * **[macOS]** `PhotoSlicer-${{ env.RELEASE_TAG }}-macOS.zip`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
